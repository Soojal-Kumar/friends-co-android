<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRIENDS & CO.</title><style>
*{box-sizing:border-box}body{font:15px Arial,sans-serif;background:#f3f5f9;margin:0;color:#1b2740}header{background:#12213b;color:#e7c579;padding:24px 18px}h1{margin:0;font-size:23px}header small{color:white}main{padding:16px;padding-bottom:100px}.card{background:white;border-radius:14px;padding:17px;margin:12px 0;box-shadow:0 1px 5px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:white;border-radius:12px;padding:15px;font-size:12px}.metric b{display:block;font-size:19px;margin-top:9px}button{border:0;background:#152540;color:white;padding:12px;border-radius:9px;margin:5px;cursor:pointer}nav{position:fixed;bottom:0;background:white;display:flex;justify-content:space-around;width:100%;padding:9px 0;border-top:1px solid #ddd}nav button{font-size:12px;background:transparent;color:#142540;padding:9px 5px}input,select{display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0 14px}.muted{color:#778296;font-size:12px}.entry{padding:12px;border-bottom:1px solid #eee}label{font-size:12px}#screen{min-height:50vh}
</style></head><body><header><h1>F&C · FRIENDS & CO.</h1><small>Android Test Build 01 · Local Prototype</small></header><main><div id="screen"></div></main><nav><button onclick="show('Home')">Home</button><button onclick="show('Sales')">Sales</button><button onclick="show('Purchase')">Purchase</button><button onclick="show('Stock')">Stock</button><button onclick="show('More')">More</button></nav><script>
let db;try{db=JSON.parse(localStorage.getItem('fc_android_v1'))}catch(e){}db=db||{products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[]};
const save=()=>localStorage.setItem('fc_android_v1',JSON.stringify(db)),fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-PK'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='Home';function show(page){current=page;let el=document.getElementById('screen'),out='<h2>'+page+'</h2>';
if(page==='Home'){let stock=db.products.reduce((s,p)=>s+p.qty,0);out+='<div class="grid">'+[['Products',db.products.length],['Customers',db.customers.length],['Suppliers',db.suppliers.length],['Total Stock',stock+' Outers'],['Sales Entries',db.sales.length],['Purchase Entries',db.purchases.length]].map(x=>'<div class="metric">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><b>Daily Profit & Ledgers</b><p class="muted">Not yet implemented. This test build is not suitable for real accounts.</p></div>'}
if(page==='Stock')out+='<button onclick="form(\'product\')">+ Add Product</button>'+rows(db.products,x=>esc(x.name)+' — '+x.qty+' Outers');
if(page==='Sales'||page==='Purchase'){let key=page==='Sales'?'sales':'purchases';out+='<button onclick="form(\''+(key==='sales'?'sale':'purchase')+'\')">+ New '+page+'</button>'+rows(db[key],x=>esc(x.no)+' · '+esc(x.party)+' · '+esc(x.product)+' · '+x.qty+' Outers · '+fmt(x.total))}
if(page==='More')out+=[['customer','Customers'],['supplier','Suppliers'],['expense','Expenses']].map(([key,title])=>'<div class="card"><b>'+title+'</b><button onclick="form(\''+key+'\')">+ Add</button>'+rows(db[key==='customer'?'customers':key==='supplier'?'suppliers':'expenses'],x=>esc(x.name||x.category)+' '+(x.amount?fmt(x.amount):''))+'</div>').join('')+'<p class="muted">Local-only test app. No cloud backup or PDF invoices.</p>';
el.innerHTML=out}function rows(arr,fn){return arr.length?arr.map(x=>'<div class="entry">'+fn(x)+'</div>').join(''):'<p class="muted">No records yet.</p>'}
function form(type){let html='<h2>New '+type+'</h2>';let party=type==='sale'?'customers':'suppliers';
if(type==='product')html+='<label>Product name</label><input id="name"><label>Opening stock (Outers)</label><input type="number" min="0" step="1" id="qty" value="0">';
if(type==='customer'||type==='supplier')html+='<label>Name</label><input id="name"><label>Phone</label><input id="phone"><label>Opening balance</label><input type="number" id="opening" value="0">';
if(type==='expense')html+='<label>Category</label><input id="category"><label>Amount (PKR)</label><input type="number" id="amount">';
if(type==='sale'||type==='purchase')html+='<label>Customer / Supplier</label><select id="party"><option value="">Select</option>'+db[party].map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><label>Product</label><select id="product"><option value="">Select</option>'+db.products.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select><label>Quantity (whole Outers)</label><input type="number" step="1" min="1" id="qty"><label>Rate per Outer</label><input type="number" min="0" id="rate"><p class="muted">One product per test invoice. Full multi-item invoices are pending.</p>';
document.getElementById('screen').innerHTML=html+'<button onclick="submit(\''+type+'\')">Save</button><button onclick="show(current)">Cancel</button>'}
const val=id=>document.getElementById(id)?.value.trim()||'';
function submit(type){if(type==='product'){let qty=Number(val('qty'));if(!val('name')||!Number.isInteger(qty)||qty<0)return alert('Enter valid name and whole outer quantity');db.products.push({name:val('name'),qty})}
if(type==='customer'||type==='supplier'){if(!val('name'))return alert('Name required');db[type+'s'].push({name:val('name'),phone:val('phone'),opening:Number(val('opening')||0)})}
if(type==='expense'){let amount=Number(val('amount'));if(!val('category')||!(amount>0))return alert('Enter category and amount');db.expenses.push({category:val('category'),amount})}
if(type==='sale'||type==='purchase'){let qty=Number(val('qty')),rate=Number(val('rate')),product=db.products.find(x=>x.name===val('product'));if(!val('party')||!product||!Number.isInteger(qty)||qty<=0||!(rate>0))return alert('Complete all fields with whole outer quantity');if(type==='sale'){if(product.qty<qty&&!confirm('Stock will be negative. Continue?'))return;product.qty-=qty}else product.qty+=qty;let arr=db[type==='sale'?'sales':'purchases'];arr.push({no:(type==='sale'?'SALE-':'PUR-')+String(arr.length+1).padStart(4,'0'),party:val('party'),product:val('product'),qty,rate,total:qty*rate})}
save();show(current);alert('Saved locally on this device.')}show('Home');
</script></body></html>
